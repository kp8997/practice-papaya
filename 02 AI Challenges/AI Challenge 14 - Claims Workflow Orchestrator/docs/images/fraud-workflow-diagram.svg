<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1060" width="100%" height="100%" style="background-color: #18181b; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- START CIRCLE -->
  <circle cx="150" cy="40" r="14" fill="#f4f4f5" />
  <line x1="150" y1="54" x2="150" y2="82" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- SUBMITTED -->
  <g transform="translate(85, 84)">
    <rect width="130" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="65" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">SUBMITTED</text>
  </g>

  <!-- PENDING_INFO -->
  <g transform="translate(265, 84)">
    <rect width="140" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="70" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">PENDING_INFO</text>
  </g>

  <!-- LINES TO DOCUMENTS_VERIFIED -->
  <!-- From SUBMITTED -->
  <line x1="150" y1="124" x2="150" y2="202" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(95, 148)">
    <rect width="110" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="55" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">document_clerk</text>
  </g>

  <!-- From PENDING_INFO -->
  <path d="M 335 124 L 335 160 L 220 160 L 220 202" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(235, 148)">
    <rect width="110" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="55" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">document_clerk</text>
  </g>

  <!-- DOCUMENTS_VERIFIED -->
  <g transform="translate(95, 204)">
    <rect width="210" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="105" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">DOCUMENTS_VERIFIED</text>
  </g>

  <!-- TRANSITION TO FRAUD_CHECK -->
  <line x1="200" y1="244" x2="200" y2="308" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <g transform="translate(135, 264)">
    <rect width="130" height="24" rx="4" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="65" y="16" fill="#fbbf24" font-size="10.5" font-weight="600" text-anchor="middle">document_clerk (new)</text>
  </g>

  <!-- NEW EXTENSION: FRAUD_CHECK STATE -->
  <g transform="translate(85, 310)">
    <rect width="230" height="46" rx="8" fill="#1e1e24" stroke="#f59e0b" stroke-width="2"/>
    <text x="115" y="24" fill="#fef08a" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.5">FRAUD_CHECK</text>
    <text x="115" y="38" fill="#f59e0b" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">★ NEW EXTENSION STATE</text>
  </g>

  <!-- FRAUD_CHECK -> UNDER_ASSESSMENT (LOW RISK) -->
  <line x1="165" y1="356" x2="165" y2="444" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <g transform="translate(70, 386)">
    <rect width="190" height="26" rx="4" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="95" y="17" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">fraud_analyst (score ≤ 70)</text>
  </g>

  <!-- FRAUD_CHECK -> REJECTED (HIGH RISK FAST-FAIL BRANCH) -->
  <path d="M 285 356 L 285 390 L 395 390 L 395 628 L 360 628" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-rose)" />
  <g transform="translate(305, 470)">
    <rect width="180" height="30" rx="4" fill="#18181b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="90" y="14" fill="#fda4af" font-size="9.5" font-weight="600" text-anchor="middle">fraud_analyst (score &gt; 70)</text>
    <text x="90" y="25" fill="#f43f5e" font-size="8.5" font-weight="600" text-anchor="middle">Fast-Fail Rejection</text>
  </g>

  <!-- UNDER_ASSESSMENT -->
  <g transform="translate(90, 446)">
    <rect width="210" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="105" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">UNDER_ASSESSMENT</text>
  </g>

  <!-- LOOP: UNDER_ASSESSMENT -> PENDING_INFO -->
  <path d="M 270 446 L 270 410 L 440 410 L 440 104 L 407 104" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(390, 240)">
    <rect width="70" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="35" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">assessor</text>
  </g>

  <!-- UNDER_ASSESSMENT -> APPROVED -->
  <line x1="140" y1="486" x2="140" y2="564" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(105, 510)">
    <rect width="70" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="35" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">assessor</text>
  </g>

  <!-- UNDER_ASSESSMENT -> REJECTED -->
  <line x1="250" y1="486" x2="250" y2="608" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(215, 535)">
    <rect width="70" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="35" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">assessor</text>
  </g>

  <!-- APPROVED -->
  <g transform="translate(75, 566)">
    <rect width="130" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="65" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">APPROVED</text>
  </g>

  <!-- REJECTED -->
  <g transform="translate(225, 610)">
    <rect width="130" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="65" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">REJECTED</text>
  </g>

  <!-- APPROVED -> PAYMENT_INITIATED -->
  <line x1="140" y1="606" x2="140" y2="688" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(110, 634)">
    <rect width="60" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="30" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">finance</text>
  </g>

  <!-- PAYMENT_INITIATED -->
  <g transform="translate(50, 690)">
    <rect width="180" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="90" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">PAYMENT_INITIATED</text>
  </g>

  <!-- REJECTED -> UNDER_ASSESSMENT (APPEAL LOOP) -->
  <path d="M 300 610 L 300 550 L 270 550 L 270 488" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(290, 565)">
    <rect width="145" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="72.5" y="16" fill="#a1a1aa" font-size="9.5" font-weight="500" text-anchor="middle">team_lead (appeal ≤ 30d)</text>
  </g>

  <!-- PAYMENT_INITIATED -> CLOSED -->
  <path d="M 140 730 L 140 790 L 190 790 L 190 826" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(110, 755)">
    <rect width="60" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="30" y="16" fill="#a1a1aa" font-size="10.5" font-weight="500" text-anchor="middle">finance</text>
  </g>

  <!-- REJECTED -> CLOSED -->
  <path d="M 290 650 L 290 790 L 230 790 L 230 826" fill="none" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <g transform="translate(240, 715)">
    <rect width="100" height="24" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="50" y="16" fill="#a1a1aa" font-size="9.5" font-weight="500" text-anchor="middle">system / finance</text>
  </g>

  <!-- CLOSED (TERMINAL) -->
  <g transform="translate(150, 828)">
    <rect width="120" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="60" y="25" fill="#f4f4f5" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">CLOSED</text>
  </g>

  <!-- CLOSED -> TERMINAL BULLSEYE -->
  <line x1="210" y1="868" x2="210" y2="920" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)" />
  <circle cx="210" cy="936" r="14" fill="none" stroke="#f4f4f5" stroke-width="2" />
  <circle cx="210" cy="936" r="7" fill="#f4f4f5" />
</svg>
